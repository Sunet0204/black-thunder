<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品ヒストリー年表</title><style>:root{font-family:system-ui,sans-serif;color:#17263c}body{margin:0;background:#f5f7fb}header{padding:24px;background:white;border-bottom:1px solid #dbe2eb}h1{margin:0 0 6px;font-size:25px}p{margin:0;color:#64748b}.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:16px 24px}button,input{padding:10px 12px;border:1px solid #ccd6e2;border-radius:9px;background:white;font:inherit}button{cursor:pointer}button.primary{background:#2563eb;color:white;border-color:#2563eb}.panel{margin:0 24px 24px;background:white;border:1px solid #dbe2eb;border-radius:14px;overflow:auto}.chart{min-width:950px}.head,.item{display:grid;grid-template-columns:190px 1fr}.head{position:sticky;top:0;background:#f8fafc;z-index:2;border-bottom:1px solid #dbe2eb}.name{padding:15px;border-right:1px solid #e2e8f0;font-weight:700}.years,.track{position:relative}.years{height:54px}.year{position:absolute;top:16px;transform:translateX(-50%);font-size:12px;color:#475569}.item{min-height:100px;border-bottom:1px solid #e2e8f0}.item:last-child{border:0}.item .name{display:flex;align-items:center;justify-content:space-between;gap:5px}.track{background:repeating-linear-gradient(to right,transparent 0,transparent calc(10% - 1px),#e5eaf1 calc(10% - 1px),#e5eaf1 10%)}.bar{position:absolute;top:35px;height:12px;border-radius:8px;opacity:.8}.point{position:absolute;top:29px;width:12px;height:12px;border:3px solid white;border-radius:50%;transform:translateX(-50%);box-shadow:0 0 0 1px #cbd5e1;cursor:pointer}.event{position:absolute;top:53px;transform:translateX(-10%);font-size:11px;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis}.delete{border:0;color:#dc2626;padding:5px}.empty{padding:35px;text-align:center;color:#64748b}small{color:#64748b}dialog{border:1px solid #dbe2eb;border-radius:14px;padding:24px;max-width:90vw}dialog form{display:grid;gap:12px;min-width:min(350px,75vw)}label{display:grid;gap:5px}menu{display:flex;gap:10px;justify-content:end;padding:0;margin:8px 0 0}@media(max-width:600px){header{padding:16px}.toolbar{padding:12px}.panel{margin:0 12px 16px}.chart{min-width:850px}}</style></head><body><header><h1>商品ヒストリー年表</h1><p>縦軸：商品 ／ 横軸：西暦</p></header><div class="toolbar"><button class="primary" onclick="openForm()">＋ 商品を追加</button><input id="search" placeholder="商品名で検索" oninput="render()"><label>開始年 <input id="from" type="number" value="1980" style="width:85px" onchange="render()"></label><label>終了年 <input id="to" type="number" value="2030" style="width:85px" onchange="render()"></label><button onclick="exportData()">JSON保存</button><button onclick="document.getElementById('import').click()">読み込み</button><input type="file" id="import" accept="application/json" hidden onchange="importData(event)"></div><div class="panel"><div id="chart" class="chart"></div></div><dialog id="dlg"><form id="form" onsubmit="saveItem(event)"><h2 id="formTitle">商品を追加</h2><input id="editIndex" type="hidden"><label>商品名<input id="product" required maxlength="80" placeholder="例：Aシリーズ"></label><label>発売年<input id="start" type="number" required></label><label>販売終了年（販売中なら空欄）<input id="end" type="number"></label><label>出来事・メモ（任意）<input id="memo" placeholder="例：モデルチェンジ"></label><menu><button type="button" onclick="dlg.close()">キャンセル</button><button class="primary">保存</button></menu></form></dialog><script>const KEY='product-timeline-v1';let items=JSON.parse(localStorage.getItem(KEY)||'null')||[{name:'Aシリーズ',start:1980,end:2005,memo:'1995年 モデルチェンジ'},{name:'Bシリーズ',start:1990,end:2018,memo:'2000年 モデルチェンジ'},{name:'Cシリーズ',start:2000,end:null,memo:'現在も販売中'}];const colors=['#3b82f6','#22c55e','#f43f5e','#eab308','#a855f7','#06b6d4'];function persist(){localStorage.setItem(KEY,JSON.stringify(items))}function openForm(i=null){form.reset();editIndex.value=i===null?'':i;formTitle.textContent=i===null?'商品を追加':'商品を編集';if(i!==null){const x=items[i];product.value=x.name;start.value=x.start;end.value=x.end??'';memo.value=x.memo??''}dlg.showModal()}function saveItem(e){e.preventDefault();let x={name:product.value.trim(),start:Number(start.value),end:end.value?Number(end.value):null,memo:memo.value.trim()};if(!Number.isSafeInteger(x.start)||(x.end!==null&&!Number.isSafeInteger(x.end)))return alert('年は有効な整数で入力してください');if(x.end!==null&&x.end<x.start)return alert('終了年は発売年以降にしてください');let i=editIndex.value;if(i==='')items.push(x);else items[Number(i)]=x;persist();dlg.close();render()}function removeItem(i){if(confirm('この商品を削除しますか？')){items.splice(i,1);persist();render()}}function render(){let a=Number(from.value),b=Number(to.value);if(!Number.isSafeInteger(a)||!Number.isSafeInteger(b)||!(b>a)){chart.innerHTML='<div class="empty">終了年は開始年より後にしてください</div>';return}let width=b-a,html='<div class="head"><div class="name">商品名</div><div class="years">';let rawStep=width<=30?5:width<=100?10:Math.ceil(width/12);let magnitude=10**Math.floor(Math.log10(rawStep));let step=[1,2,5,10].map(n=>n*magnitude).find(n=>n>=rawStep)||rawStep;let ticks=0;for(let y=Math.ceil(a/step)*step;y<=b&&ticks<30;y+=step,ticks++)html+=`<span class="year" style="left:${(y-a)/width*100}%">${y}</span>`;html+='</div></div>';let count=0;items.forEach((x,i)=>{if(!x.name.toLowerCase().includes(search.value.toLowerCase()))return;count++;let c=colors[i%colors.length],s=Math.max(a,x.start),e=Math.min(b,x.end??b);html+=`<div class="item"><div class="name"><span>${esc(x.name)}<br><small>${x.start}年〜${x.end??'現在'}</small></span><span><button title="編集" onclick="openForm(${i})">✎</button><button class="delete" title="削除" onclick="removeItem(${i})">×</button></span></div><div class="track">`;if(e>=s){html+=`<div class="bar" style="background:${c};left:${(s-a)/width*100}%;width:${(e-s)/width*100}%"></div>`;if(x.start>=a&&x.start<=b)html+=`<span class="point" style="background:${c};left:${(x.start-a)/width*100}%" title="発売：${x.start}年"></span><span class="event" style="left:${(x.start-a)/width*100}%">${x.start} 発売</span>`;if(x.end!==null&&x.end>=a&&x.end<=b)html+=`<span class="point" style="background:${c};left:${(x.end-a)/width*100}%" title="販売終了：${x.end}年"></span>`;if(x.memo)html+=`<span class="event" style="left:${Math.min(78,Math.max(12,((s+e)/2-a)/width*100))}%;top:76px" title="${esc(x.memo)}">${esc(x.memo)}</span>`}html+='</div></div>'});chart.innerHTML=html+(count?'':'<div class="empty">商品がありません</div>')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function exportData(){let blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='商品年表.json';a.click();URL.revokeObjectURL(a.href)}async function importData(e){try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d)||!d.every(x=>typeof x.name==='string'&&Number.isFinite(x.start)))throw Error();items=d;persist();render()}catch{alert('正しいJSONファイルを選択してください')}e.target.value=''}render();</script></body></html>
