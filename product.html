<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>商品詳細</title>

<style>
body{
    max-width:900px;
    margin:auto;
    padding:20px;
}

#backLink{
    display:inline-block;
    margin-bottom:20px;
}

#productImage{
    display:block;
    max-width:400px;
    width:100%;
    height:auto;
    margin:20px 0;
}

.info{
    margin:10px 0;
}

.label{
    font-weight:bold;
}

#descriptionArea{
    margin-top:30px;
}

#description{
    white-space:pre-wrap;
    line-height:1.8;
}

#officialArea,
#referenceArea{
    margin-top:30px;
}

.linkList{
    margin:0;
    padding-left:25px;
}

.linkList li{
    margin-bottom:8px;
}

#error{
    color:red;
}
</style>

</head>

<body>

<a id="backLink" href="index.html">
    ← 商品一覧へ戻る
</a>

<main id="productArea" hidden>

    <h1 id="productName"></h1>

    <img
        id="productImage"
        src=""
        alt=""
    >

    <div class="info">
        <span class="label">発売日：</span>
        <span id="releaseDate"></span>
    </div>

    <div
        class="info"
        id="nicknameArea"
    >
        <span class="label">二つ名：</span>
        <span id="nickname"></span>
    </div>

    <div
        class="info"
        id="sizeArea"
    >
        <span
            class="label"
            id="sizeLabel"
        >
            サイズ：
        </span>

        <span id="size"></span>
    </div>

    <div
        class="info"
        id="flavorArea"
    >
        <span class="label">
            味：
        </span>

        <span id="flavor"></span>
    </div>

    <div
        class="info"
        id="seriesArea"
    >
        <span class="label">
            シリーズ区分：
        </span>

        <span id="series"></span>
    </div>

    <!-- 商品紹介 -->

    <section id="descriptionArea">

        <h2>商品紹介</h2>

        <p id="description"></p>

    </section>

    <!-- 公式記事 -->

    <section id="officialArea">

        <h2>公式記事</h2>

        <ul
            id="officialLinks"
            class="linkList"
        ></ul>

    </section>

    <!-- 参考リンク -->

    <section id="referenceArea">

        <h2>参考リンク</h2>

        <ul
            id="referenceLinks"
            class="linkList"
        ></ul>

    </section>

</main>

<p id="error"></p>


<script>

// ==========================================
// DOM取得
// ==========================================

const $ =
    id =>
        document.getElementById(id);


// ==========================================
// URLから商品情報取得
// ==========================================

const params =
    new URLSearchParams(
        location.search
    );

const type =
    params.get("type");

const year =
    params.get("year");

// 新方式ではIDは文字列
const id =
    params.get("id");


// ==========================================
// JSONの場所
// ==========================================

function getJsonPath(
    type,
    year
) {

    if (
        type === "index"
    ) {

        return `json/${year}.json`;

    }

    if (
        type === "thun2"
    ) {

        return `json2/${year}-2.json`;

    }

    if (
        type === "thun3"
    ) {

        return `json3/${year}-3.json`;

    }

    return null;
}


// ==========================================
// 単一データ・複数データを
// 必ず配列にする
// ==========================================

function toArray(
    value
) {

    if (
        value == null ||
        value === ""
    ) {

        return [];

    }

    return Array.isArray(value)
        ? value
        : [value];
}


// ==========================================
// 値がない項目を非表示
// ==========================================

function setText(
    areaId,
    textId,
    value
) {

    const area =
        $(areaId);

    const element =
        $(textId);

    if (
        value == null ||
        value === ""
    ) {

        area.hidden =
            true;

        return;

    }

    element.textContent =
        value;

    area.hidden =
        false;
}


// ==========================================
// リンク一覧を作成
// ==========================================

function createLinks(
    areaId,
    listId,
    links,
    text
) {

    const area =
        $(areaId);

    const list =
        $(listId);

    list.replaceChildren();

    const urls =
        toArray(
            links
        ).filter(
            url =>
                typeof url === "string" &&
                url.trim() !== ""
        );

    // URLが1個もない場合
    if (
        urls.length === 0
    ) {

        area.hidden =
            true;

        return;

    }

    // URLごとにリンクを作成
    urls.forEach(
        (url,index) => {

            const li =
                document.createElement(
                    "li"
                );

            const a =
                document.createElement(
                    "a"
                );

            a.href =
                url;

            a.target =
                "_blank";

            a.rel =
                "noopener noreferrer";

            // 1件なら普通の名前
            // 複数なら番号を付ける
            a.textContent =
                urls.length === 1
                    ? text
                    : `${text} ${index + 1}`;

            li.append(
                a
            );

            list.append(
                li
            );

        }
    );

    area.hidden =
        false;
}


// ==========================================
// エラー表示
// ==========================================

function showError(
    message
) {

    $("productArea").hidden =
        true;

    $("error").textContent =
        message;
}


// ==========================================
// 商品読み込み
// ==========================================

async function loadProduct() {

    const jsonPath =
        getJsonPath(
            type,
            year
        );


    // ======================================
    // URLチェック
    // ======================================

    if (
        !jsonPath ||
        !year ||
        !id
    ) {

        showError(
            "商品のURLが正しくありません。"
        );

        return;

    }


    try {

        // ==================================
        // JSON読み込み
        // ==================================

        const response =
            await fetch(
                jsonPath
            );

        if (
            !response.ok
        ) {

            throw new Error(
                `${jsonPath} を読み込めません`
            );

        }

        const items =
            await response.json();


        // ==================================
        // 商品取得
        //
        // 配列番号ではなく
        // item.id から探す
        // ==================================

        const item =
            items.find(
                item =>
                    String(item.id) === id
            );


        if (
            !item
        ) {

            showError(
                "商品が見つかりませんでした。"
            );

            return;

        }


        // ==================================
        // 商品名
        // ==================================

        const name =
            item.name ||
            "商品詳細";

        $("productName").textContent =
            name;

        document.title =
            `${name} | ブラックサンダー`;


        // ==================================
        // 商品画像
        // ==================================

        const image =
            item.image || "";

        if (
            image
        ) {

            $("productImage").src =
                image;

            $("productImage").alt =
                name;

            $("productImage").hidden =
                false;

        }

        else {

            $("productImage").removeAttribute(
                "src"
            );

            $("productImage").hidden =
                true;

        }


        // ==================================
        // 発売日
        // ==================================

        $("releaseDate").textContent =
            item.releaseDate ||
            "不明";


        // ==================================
        // 二つ名
        // ==================================

        setText(
            "nicknameArea",
            "nickname",
            item.nickname
        );


        // ==================================
        // サイズ / コラボ先
        // ==================================

        if (
            type === "thun3"
        ) {

            $("sizeLabel").textContent =
                "コラボ先：";

            setText(
                "sizeArea",
                "size",
                item.collab
            );

        }

        else {

            $("sizeLabel").textContent =
                "サイズ：";

            setText(
                "sizeArea",
                "size",
                item.size
            );

        }


        // ==================================
        // ブラックサンダー専用情報
        // ==================================

        if (
            type === "index"
        ) {

            // ------------------------------
            // 味
            // ------------------------------

            const flavors =
                toArray(
                    item.flavors
                );

            if (
                flavors.length
            ) {

                $("flavor").textContent =
                    flavors.join("・");

                $("flavorArea").hidden =
                    false;

            }

            else {

                $("flavorArea").hidden =
                    true;

            }


            // ------------------------------
            // シリーズ区分
            // ------------------------------

            const series =
                toArray(
                    item.series
                );

            if (
                series.length
            ) {

                $("series").textContent =
                    series.join("・");

                $("seriesArea").hidden =
                    false;

            }

            else {

                $("seriesArea").hidden =
                    true;

            }

        }

        else {

            $("flavorArea").hidden =
                true;

            $("seriesArea").hidden =
                true;

        }


        // ==================================
        // 商品紹介文
        // ==================================

        const description =
            item.description || "";

        if (
            description
        ) {

            $("description").textContent =
                description;

            $("descriptionArea").hidden =
                false;

        }

        else {

            $("descriptionArea").hidden =
                true;

        }


        // ==================================
        // 公式記事
        // ==================================

        createLinks(
            "officialArea",
            "officialLinks",
            item.officialLinks,
            "公式記事を見る"
        );


        // ==================================
        // 参考リンク
        // ==================================

        createLinks(
            "referenceArea",
            "referenceLinks",
            item.referenceLinks,
            "参考ページを見る"
        );


        // ==================================
        // 商品ページ表示
        // ==================================

        $("productArea").hidden =
            false;

        $("error").textContent =
            "";

    }

    catch (
        error
    ) {

        console.error(
            error
        );

        showError(
            "商品情報の読み込みに失敗しました。"
        );

    }

}


// ==========================================
// 読み込み開始
// ==========================================

loadProduct();

</script>

</body>

</html>
