<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>商品詳細</title>

<style>
body{
    max-width:900px;
    margin:auto;
    padding:20px;
}

#backLink{
    display:inline-block;
    margin-bottom:20px;
}

#productImage{
    display:block;
    max-width:400px;
    width:100%;
    height:auto;
    margin:20px 0;
}

.info{
    margin:10px 0;
}

.label{
    font-weight:bold;
}

#descriptionArea{
    margin-top:30px;
}

#description{
    white-space:pre-wrap;
    line-height:1.8;
}

#referenceArea{
    margin-top:30px;
}

#error{
    color:red;
}
</style>

</head>


<body>

<a id="backLink" href="index.html">
    ← 商品一覧へ戻る
</a>


<main id="productArea" hidden>

    <h1 id="productName"></h1>

    <img
        id="productImage"
        src=""
        alt=""
    >


    <div class="info">
        <span class="label">発売日：</span>
        <span id="releaseDate"></span>
    </div>


    <div
        class="info"
        id="nicknameArea"
    >
        <span class="label">二つ名：</span>
        <span id="nickname"></span>
    </div>


    <div
        class="info"
        id="sizeArea"
    >
        <span
            class="label"
            id="sizeLabel"
        >
            サイズ：
        </span>

        <span id="size"></span>
    </div>


    <div
        class="info"
        id="flavorArea"
    >
        <span class="label">
            味：
        </span>

        <span id="flavor"></span>
    </div>


    <div
        class="info"
        id="seriesArea"
    >
        <span class="label">
            シリーズ区分：
        </span>

        <span id="series"></span>
    </div>


    <!-- =========================
         商品紹介
    ========================== -->

    <section id="descriptionArea">

        <h2>商品紹介</h2>

        <p id="description"></p>

    </section>


    <!-- =========================
         公式・参考ページ
    ========================== -->

    <div id="referenceArea">

        <a
            id="referenceLink"
            href=""
            target="_blank"
            rel="noopener noreferrer"
        >
            公式・参考ページを見る
        </a>

    </div>

</main>


<p id="error"></p>


<script>

// ==========================================
// DOM取得
// ==========================================

const $ =
    id =>
        document.getElementById(id);


// ==========================================
// URLから情報取得
//
// product.html
// ?type=index
// &year=2026
// &id=0
// ==========================================

const params =
    new URLSearchParams(
        location.search
    );


const type =
    params.get("type");

const year =
    params.get("year");

const id =
    Number(
        params.get("id")
    );


// ==========================================
// JSONの場所
// ==========================================

function getJsonPath(
    type,
    year
) {

    if (type === "index") {

        return `json/${year}.json`;

    }


    if (type === "thun2") {

        return `json2/${year}-2.json`;

    }


    if (type === "thun3") {

        return `json3/${year}-3.json`;

    }


    return null;
}


// ==========================================
// 単一・複数データを
// 配列に統一
// ==========================================

function toArray(value) {

    if (
        value == null ||
        value === ""
    ) {

        return [];

    }


    return Array.isArray(value)
        ? value
        : [value];
}


// ==========================================
// 値がない項目を非表示
// ==========================================

function setText(
    areaId,
    textId,
    value
) {

    const area =
        $(areaId);

    const element =
        $(textId);


    if (
        value == null ||
        value === ""
    ) {

        area.hidden =
            true;

        return;

    }


    element.textContent =
        value;

    area.hidden =
        false;
}


// ==========================================
// エラー表示
// ==========================================

function showError(
    message
) {

    $("productArea").hidden =
        true;

    $("error").textContent =
        message;
}


// ==========================================
// 商品読み込み
// ==========================================

async function loadProduct() {

    // --------------------------------------
    // URL確認
    // --------------------------------------

    const jsonPath =
        getJsonPath(
            type,
            year
        );


    if (
        !jsonPath ||
        !year ||
        !Number.isInteger(id) ||
        id < 0
    ) {

        showError(
            "商品のURLが正しくありません。"
        );

        return;
    }


    try {

        // ----------------------------------
        // JSON読み込み
        // ----------------------------------

        const response =
            await fetch(
                jsonPath
            );


        if (
            !response.ok
        ) {

            throw new Error(
                `${jsonPath} を読み込めません`
            );

        }


        const items =
            await response.json();


        // ----------------------------------
        // 商品取得
        // ----------------------------------

        const item =
            items[id];


        if (
            !item
        ) {

            showError(
                "商品が見つかりませんでした。"
            );

            return;
        }


        // ==================================
        // [0] 商品名
        // ==================================

        const name =
            item[0] || "商品詳細";


        $("productName").textContent =
            name;

        document.title =
            `${name} | ブラックサンダー`;


        // ==================================
        // [4] 商品画像
        // ==================================

        const image =
            item[4] || "";


        if (image) {

            $("productImage").src =
                image;

            $("productImage").alt =
                name;

            $("productImage").hidden =
                false;

        }

        else {

            $("productImage").hidden =
                true;

        }


        // ==================================
        // [1] 発売日
        // ==================================

        $("releaseDate").textContent =
            item[1] || "不明";


        // ==================================
        // [2] 二つ名
        // ==================================

        setText(
            "nicknameArea",
            "nickname",
            item[2]
        );


        // ==================================
        // [3]
        //
        // index / thun2
        // → サイズ
        //
        // thun3
        // → コラボ先
        // ==================================

        if (
            type === "thun3"
        ) {

            $("sizeLabel").textContent =
                "コラボ先：";

        }

        else {

            $("sizeLabel").textContent =
                "サイズ：";

        }


        setText(
            "sizeArea",
            "size",
            item[3]
        );


        // ==================================
        // ブラックサンダー専用
        // ==================================

        if (
            type === "index"
        ) {

            // ------------------------------
            // [6] 味
            // 複数対応
            // ------------------------------

            const flavors =
                toArray(
                    item[6]
                );


            if (
                flavors.length
            ) {

                $("flavor").textContent =
                    flavors.join("・");

                $("flavorArea").hidden =
                    false;

            }

            else {

                $("flavorArea").hidden =
                    true;

            }


            // ------------------------------
            // [7] シリーズ区分
            // 複数対応
            // ------------------------------

            const series =
                toArray(
                    item[7]
                );


            if (
                series.length
            ) {

                $("series").textContent =
                    series.join("・");

                $("seriesArea").hidden =
                    false;

            }

            else {

                $("seriesArea").hidden =
                    true;

            }

        }

        else {

            $("flavorArea").hidden =
                true;

            $("seriesArea").hidden =
                true;

        }


        // ==================================
        // [8] 商品紹介文
        // ==================================

        const description =
            item[8] || "";


        if (
            description
        ) {

            $("description").textContent =
                description;

            $("descriptionArea").hidden =
                false;

        }

        else {

            // 紹介文がない古い商品は
            // 「商品紹介」自体を表示しない

            $("descriptionArea").hidden =
                true;

        }


        // ==================================
        // [5] 公式・参考URL
        // ==================================

        const referenceUrl =
            item[5] || "";


        // abc.html は以前の仮URLなので非表示
        if (
            referenceUrl &&
            referenceUrl !== "abc.html"
        ) {

            $("referenceLink").href =
                referenceUrl;

            $("referenceArea").hidden =
                false;

        }

        else {

            $("referenceArea").hidden =
                true;

        }


        // ==================================
        // 商品全体を表示
        // ==================================

        $("productArea").hidden =
            false;

        $("error").textContent =
            "";

    }

    catch (
        error
    ) {

        console.error(
            error
        );


        showError(
            "商品情報の読み込みに失敗しました。"
        );

    }

}


// ==========================================
// 読み込み開始
// ==========================================

loadProduct();

</script>

</body>

</html>
