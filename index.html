<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ブラックサンダー</title>
<style>
body{max-width:1200px;margin:auto;padding:20px}table,th,td{border:1px solid #000;border-collapse:collapse}.hidden{display:none}.menu{margin-bottom:20px}.menu button,#filterArea button{margin:0 5px 5px 0}h2{cursor:pointer}#totalCount{font-weight:bold;margin-bottom:20px}#filterArea{margin:15px 0}.filter-group{margin-bottom:8px}.filter-group button.selected{background:#333;color:#fff;font-weight:bold}img{max-width:100%;height:auto}input,button{font-size:16px;padding:6px}button{padding-inline:10px}
</style>
</head>
<body>
<h1 id="mainTitle">ブラックサンダー</h1>
<p id="totalCount">収録商品数：0件</p>
<p>種類</p>
<div class="menu">
  <button data-type="index">ブラックサンダー</button>
  <button data-type="thun2">ユーラク他商品</button>
  <button data-type="thun3">コラボメニュー</button>
</div>
<button id="showAllBtn">全表示</button>
<input id="searchBox" type="text" placeholder="商品名を検索">
<div id="filterArea"></div>
<div id="tableArea"></div>
<script>
const $=id=>document.getElementById(id);
const els={title:$('mainTitle'),count:$('totalCount'),search:$('searchBox'),filters:$('filterArea'),tables:$('tableArea')};
const years=[1994,2000,2003,2005,2006,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026];
const years2=[1994,2002,...years.slice(2)];
const types={
  index:{title:'ブラックサンダー',years,path:y=>`json/${y}.json`},
  thun2:{title:'ユーラク他商品',years:years2,path:y=>`json2/${y}-2.json`},
  thun3:{title:'コラボメニュー',years:years2,path:y=>`json3/${y}-3.json`}
};
let currentType='index',loadToken=0;
const state={size:'',flavor:'',event:'',collab:''};
const meta=new WeakMap();
const array=v=>v==null||v===''?[]:Array.isArray(v)?v:[v];
const resetState=()=>Object.keys(state).forEach(k=>state[k]='');

function heading(table,visible=null){
  const h2=table.previousElementSibling;
  const count=visible??table.tBodies[0].rows.length;
  h2.textContent=`${table.classList.contains('hidden')?'▶':'▼'} ${h2.dataset.year}（${count}件）`;
}
function updateCount(){
  let total=0;
  document.querySelectorAll('#tableArea table').forEach(t=>{total+=t.tBodies[0].rows.length;heading(t)});
  els.count.textContent=`収録商品数：${total}件`;
}
function cell(text=''){const td=document.createElement('td');td.textContent=text??'';return td}
function rowFor(item,type,year,i){
  const tr=document.createElement('tr');
  const url=`product.html?type=${encodeURIComponent(type)}&year=${year}&id=${i}`;
  const info={name:String(item[0]||'').toLowerCase(),filter:item[3]||'',flavors:[],events:[]};
  if(type==='index'){info.flavors=array(item[6]);info.events=array(item[7])}
  meta.set(tr,info);

  const name=cell();
  const link=document.createElement('a');link.href=url;link.textContent=item[0]||'';name.append(link);
  tr.append(name,cell(item[1]),cell(item[2]),cell(item[3]));

  const image=cell();
  const imageLink=document.createElement('a');imageLink.href=url;
  const img=document.createElement('img');img.src=item[4]||'';img.alt=item[0]||'';img.width=100;img.loading='lazy';
  imageLink.append(img);image.append(imageLink);tr.append(image);
  return tr;
}
function section(year,type){
  const h2=document.createElement('h2');h2.dataset.year=year;h2.textContent=`▶ ${year}（0件）`;
  const table=document.createElement('table');table.className='hidden';
  const head=document.createElement('tr');
  ['名前','発売日','二つ名',type==='thun3'?'コラボ先':'サイズ','画像'].forEach(x=>{const th=document.createElement('th');th.textContent=x;head.append(th)});
  const thead=document.createElement('thead');thead.append(head);table.append(thead,document.createElement('tbody'));
  h2.onclick=()=>{table.classList.toggle('hidden');heading(table)};
  els.tables.append(h2,table);
  return table.tBodies[0];
}
async function loadYear(path,tbody,type,year,token){
  try{
    const res=await fetch(path);if(!res.ok)throw Error(`${path} を読み込めません`);
    const items=await res.json();if(token!==loadToken||type!==currentType)return;
    const frag=document.createDocumentFragment();items.forEach((item,i)=>frag.append(rowFor(item,type,year,i)));tbody.append(frag);
  }catch(e){console.error(`${path} の読み込みに失敗しました`,e)}
}
async function changeType(type){
  currentType=type;const token=++loadToken;const cfg=types[type];
  els.title.textContent=document.title=cfg.title;els.count.textContent='収録商品数：0件';
  resetState();els.search.value='';els.filters.replaceChildren();els.tables.replaceChildren();
  const jobs=cfg.years.map(year=>loadYear(cfg.path(year),section(year,type),type,year,token));
  await Promise.all(jobs);if(token!==loadToken)return;
  updateCount();createFilters();
}
function values(key){
  const out=new Set();
  document.querySelectorAll('#tableArea tbody tr').forEach(row=>{
    const m=meta.get(row);const v=m[key];(Array.isArray(v)?v:[v]).forEach(x=>x&&out.add(x));
  });
  return [...out];
}
function group(title,key,list){
  const div=document.createElement('div');div.className='filter-group';
  const strong=document.createElement('strong');strong.textContent=`${title}：`;div.append(strong);
  [['すべて',''],...list.map(v=>[v,v])].forEach(([text,value])=>{
    const b=document.createElement('button');b.textContent=text;b.classList.toggle('selected',state[key]===value);
    b.onclick=()=>{state[key]=value;[...div.querySelectorAll('button')].forEach(x=>x.classList.toggle('selected',x===b));applyFilters()};div.append(b);
  });
  els.filters.append(div);
}
function createFilters(){
  els.filters.replaceChildren();
  if(currentType==='index'){
    group('サイズ','size',values('filter'));group('味','flavor',values('flavors'));group('シリーズ区分','event',values('events'));
  }else if(currentType==='thun3') group('コラボ先','collab',values('filter'));
}
function filtering(){return !!(els.search.value.trim()||Object.values(state).some(Boolean))}
function applyFilters(){
  const keyword=els.search.value.toLowerCase();const active=filtering();
  document.querySelectorAll('#tableArea table').forEach(table=>{
    let count=0;
    [...table.tBodies[0].rows].forEach(row=>{
      const m=meta.get(row);let show=!keyword||m.name.includes(keyword);
      if(currentType==='index') show=show&&(!state.size||m.filter===state.size)&&(!state.flavor||m.flavors.includes(state.flavor))&&(!state.event||m.events.includes(state.event));
      else if(currentType==='thun3') show=show&&(!state.collab||m.filter===state.collab);
      row.hidden=!show;if(show)count++;
    });
    const h2=table.previousElementSibling;
    if(active){h2.hidden=!count;table.classList.toggle('hidden',!count);if(count){h2.textContent=`▼ ${h2.dataset.year}（${count}件）`}}
    else{h2.hidden=false;table.classList.add('hidden');heading(table)}
  });
}
function showAll(){
  resetState();els.search.value='';
  document.querySelectorAll('#tableArea tbody tr').forEach(r=>r.hidden=false);
  document.querySelectorAll('#tableArea h2').forEach(h=>h.hidden=false);
  document.querySelectorAll('#tableArea table').forEach(t=>{t.classList.remove('hidden');heading(t)});
  createFilters();
}
document.querySelector('.menu').onclick=e=>{const type=e.target.dataset.type;if(type)changeType(type)};
els.search.addEventListener('input',applyFilters);
$('showAllBtn').addEventListener('click',showAll);
changeType('index');
</script>
</body>
</html>
