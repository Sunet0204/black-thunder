<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブラックサンダー</title>

    <style>
        body {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        table,
        th,
        td {
            border: 1px solid black;
            border-collapse: collapse;
        }

        .hidden {
            display: none;
        }

        .menu {
            margin-bottom: 20px;
        }

        .menu button {
            margin-right: 5px;
        }

        h2 {
            cursor: pointer;
        }

        #totalCount {
            font-weight: bold;
            margin-bottom: 20px;
        }

        #filterArea {
            margin: 15px 0;
        }

        #filterArea button {
            margin-right: 5px;
            margin-bottom: 5px;
        }

        .filter-group {
            margin-bottom: 8px;
        }

        .filter-group button.selected {
            background-color: #333;
            color: white;
            font-weight: bold;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        input {
            font-size: 16px;
            padding: 6px;
        }

        button {
            font-size: 16px;
            padding: 6px 10px;
        }
    </style>
</head>

<body>

    <h1 id="mainTitle">ブラックサンダー</h1>

    <p id="totalCount">収録商品数：0件</p>

    <p>種類</p>

    <div class="menu">
        <button onclick="changeType('index')">ブラックサンダー</button>
        <button onclick="changeType('thun2')">ユーラク他商品</button>
        <button onclick="changeType('thun3')">コラボメニュー</button>
    </div>

    <button id="showAllBtn">全表示</button>

    <input
        type="text"
        id="searchBox"
        placeholder="商品名を検索"
    >

    <div id="filterArea"></div>

    <div id="tableArea"></div>


<script>

// ==========================================
// 状態
// ==========================================

let currentType = "index";

let selectedSize = "";
let selectedFlavor = "";
let selectedEvent = "";
let selectedCollab = "";


// ==========================================
// 各種類の設定
// ==========================================

const dataTypes = {

    index: {
        title: "ブラックサンダー",

        years: [
            1994, 2000, 2003, 2005, 2006,
            2008, 2009, 2010, 2011, 2012,
            2013, 2014, 2015, 2016, 2017,
            2018, 2019, 2020, 2021, 2022,
            2023, 2024, 2025, 2026
        ],

        getPath: year =>
            `json/${year}.json`
    },


    thun2: {
        title: "ユーラク他商品",

        years: [
            1994, 2002, 2003, 2005, 2006,
            2008, 2009, 2010, 2011, 2012,
            2013, 2014, 2015, 2016, 2017,
            2018, 2019, 2020, 2021, 2022,
            2023, 2024, 2025, 2026
        ],

        getPath: year =>
            `json2/${year}-2.json`
    },


    thun3: {
        title: "コラボメニュー",

        years: [
            1994, 2002, 2003, 2005, 2006,
            2008, 2009, 2010, 2011, 2012,
            2013, 2014, 2015, 2016, 2017,
            2018, 2019, 2020, 2021, 2022,
            2023, 2024, 2025, 2026
        ],

        getPath: year =>
            `json3/${year}-3.json`
    }

};


// ==========================================
// 年代見出し
// ==========================================

function updateYearHeading(h2, table) {

    const year = h2.dataset.year;

    const count =
        table.querySelectorAll("tbody tr").length;

    const mark =
        table.classList.contains("hidden")
            ? "▶"
            : "▼";

    h2.textContent =
        `${mark} ${year}（${count}件）`;
}


// ==========================================
// 全年代見出し更新
// ==========================================

function updateAllYearHeadings() {

    document
        .querySelectorAll("#tableArea table")
        .forEach(table => {

            const h2 =
                table.previousElementSibling;

            if (h2) {
                updateYearHeading(h2, table);
            }

        });
}


// ==========================================
// 商品件数更新
// ==========================================

function updateCounts() {

    let total = 0;

    document
        .querySelectorAll("#tableArea table")
        .forEach(table => {

            const count =
                table.querySelectorAll(
                    "tbody tr"
                ).length;

            total += count;

            const h2 =
                table.previousElementSibling;

            if (h2) {
                updateYearHeading(h2, table);
            }

        });

    document.getElementById(
        "totalCount"
    ).textContent =
        `収録商品数：${total}件`;
}


// ==========================================
// 商品一覧作成
// ==========================================

function makeTable(
    jsonFile,
    tbody,
    type,
    year
) {

    fetch(jsonFile)

        .then(res => {

            if (!res.ok) {
                throw new Error(
                    `${jsonFile} を読み込めません`
                );
            }

            return res.json();
        })

        .then(items => {

            // 表示種類が途中で変わった場合
            if (type !== currentType) {
                return;
            }


            items.forEach((item, i) => {

                const tr =
                    document.createElement("tr");


                // 個別商品ページ
                const productUrl =
                    `product.html?type=${encodeURIComponent(type)}&year=${encodeURIComponent(year)}&id=${encodeURIComponent(i)}`;


                // [3]
                // index / thun2 = サイズ
                // thun3 = コラボ先

                tr.dataset.filter =
                    item[3] || "";


                // ブラックサンダー専用
                if (type === "index") {

                    // [6] 味
                    tr.dataset.flavor =
                        item[6] || "";


                    // [7] シリーズ区分
                    let seriesList =
                        item[7] || [];

                    if (
                        !Array.isArray(seriesList)
                    ) {
                        seriesList =
                            [seriesList];
                    }

                    tr.dataset.event =
                        JSON.stringify(
                            seriesList
                        );
                }


                // ----------------------------------
                // 表示列
                // ----------------------------------

                for (let j = 0; j <= 4; j++) {

                    const td =
                        document.createElement("td");


                    // 商品名
                    if (j === 0) {

                        const a =
                            document.createElement("a");

                        a.textContent =
                            item[0] || "";

                        a.href =
                            productUrl;

                        td.appendChild(a);
                    }


                    // 画像
                    else if (j === 4) {

                        const a =
                            document.createElement("a");

                        a.href =
                            productUrl;


                        const img =
                            document.createElement("img");

                        img.src =
                            item[4] || "";

                        img.alt =
                            item[0] || "";

                        img.width =
                            100;

                        // 画面外画像を遅延読み込み
                        img.loading =
                            "lazy";


                        a.appendChild(img);

                        td.appendChild(a);
                    }


                    // その他
                    else {

                        td.textContent =
                            item[j] || "";
                    }


                    tr.appendChild(td);
                }


                tbody.appendChild(tr);
            });


            createFilterButtons(type);

            updateCounts();


            if (isFiltering()) {
                applyFilters();
            }

        })

        .catch(error => {

            console.error(
                `${jsonFile} の読み込みに失敗しました`,
                error
            );

        });
}


// ==========================================
// 表見出し
// ==========================================

function makeList(tr, type) {

    const fourthColumn =
        type === "thun3"
            ? "コラボ先"
            : "サイズ";

    const list = [
        "名前",
        "発売日",
        "二つ名",
        fourthColumn,
        "画像"
    ];

    list.forEach(text => {

        const th =
            document.createElement("th");

        th.textContent =
            text;

        tr.appendChild(th);
    });
}


// ==========================================
// 種類変更
// ==========================================

function changeType(type) {

    currentType =
        type;

    const setting =
        dataTypes[type];


    // タイトル
    document.getElementById(
        "mainTitle"
    ).textContent =
        setting.title;

    document.title =
        setting.title;


    // 件数
    document.getElementById(
        "totalCount"
    ).textContent =
        "収録商品数：0件";


    // 絞り込み条件リセット
    selectedSize = "";
    selectedFlavor = "";
    selectedEvent = "";
    selectedCollab = "";


    const area =
        document.getElementById(
            "tableArea"
        );

    const filterArea =
        document.getElementById(
            "filterArea"
        );

    const searchBox =
        document.getElementById(
            "searchBox"
        );


    area.innerHTML = "";
    filterArea.innerHTML = "";
    searchBox.value = "";


    // --------------------------------------
    // 年代ごとに作成
    // --------------------------------------

    setting.years.forEach(year => {

        // 年代見出し
        const h2 =
            document.createElement("h2");

        h2.dataset.year =
            year;

        h2.textContent =
            `▶ ${year}（0件）`;


        // table
        const table =
            document.createElement("table");

        table.classList.add(
            "hidden"
        );


        // thead
        const thead =
            document.createElement("thead");

        const headerRow =
            document.createElement("tr");

        makeList(
            headerRow,
            type
        );

        thead.appendChild(
            headerRow
        );


        // tbody
        const tbody =
            document.createElement("tbody");


        table.append(
            thead,
            tbody
        );


        // 年代クリック
        h2.addEventListener(
            "click",
            () => {

                table.classList.toggle(
                    "hidden"
                );

                updateYearHeading(
                    h2,
                    table
                );
            }
        );


        area.append(
            h2,
            table
        );


        // JSON読み込み
        const jsonPath =
            setting.getPath(year);

        makeTable(
            jsonPath,
            tbody,
            type,
            year
        );

    });
}


// ==========================================
// 絞り込みボタン作成
// ==========================================

function createButtonGroup(
    filterArea,
    titleText,
    values,
    selectedValue,
    clickFunction
) {

    const div =
        document.createElement("div");

    div.classList.add(
        "filter-group"
    );


    const title =
        document.createElement("strong");

    title.textContent =
        `${titleText}：`;

    div.appendChild(title);


    // --------------------------------------
    // ボタン作成共通処理
    // --------------------------------------

    function addButton(
        text,
        value
    ) {

        const button =
            document.createElement("button");

        button.textContent =
            text;


        if (
            selectedValue === value
        ) {
            button.classList.add(
                "selected"
            );
        }


        button.addEventListener(
            "click",
            () => {

                div
                    .querySelectorAll("button")
                    .forEach(btn =>
                        btn.classList.remove(
                            "selected"
                        )
                    );

                button.classList.add(
                    "selected"
                );

                clickFunction(value);
            }
        );


        div.appendChild(button);
    }


    // すべて
    addButton(
        "すべて",
        ""
    );


    // 各値
    values.forEach(value => {
        addButton(
            value,
            value
        );
    });


    filterArea.appendChild(div);
}


// ==========================================
// 絞り込みボタン更新
// ==========================================

function createFilterButtons(type) {

    if (type !== currentType) {
        return;
    }


    const filterArea =
        document.getElementById(
            "filterArea"
        );

    const rows =
        document.querySelectorAll(
            "#tableArea tbody tr"
        );


    // --------------------------------------
    // ブラックサンダー
    // --------------------------------------

    if (type === "index") {

        const sizes =
            new Set();

        const flavors =
            new Set();

        const events =
            new Set();


        rows.forEach(row => {

            const size =
                row.dataset.filter;

            const flavor =
                row.dataset.flavor;

            let eventList = [];

            try {
                eventList =
                    JSON.parse(
                        row.dataset.event ||
                        "[]"
                    );
            }

            catch {
                eventList = [];
            }


            if (size) {
                sizes.add(size);
            }

            if (flavor) {
                flavors.add(flavor);
            }

            eventList.forEach(event => {

                if (event) {
                    events.add(event);
                }

            });
        });


        filterArea.innerHTML = "";


        createButtonGroup(
            filterArea,
            "サイズ",
            sizes,
            selectedSize,
            value => {

                selectedSize =
                    value;

                applyFilters();
            }
        );


        createButtonGroup(
            filterArea,
            "味",
            flavors,
            selectedFlavor,
            value => {

                selectedFlavor =
                    value;

                applyFilters();
            }
        );


        createButtonGroup(
            filterArea,
            "シリーズ区分",
            events,
            selectedEvent,
            value => {

                selectedEvent =
                    value;

                applyFilters();
            }
        );
    }


    // --------------------------------------
    // コラボメニュー
    // --------------------------------------

    else if (type === "thun3") {

        const collabs =
            new Set();


        rows.forEach(row => {

            const collab =
                row.dataset.filter;

            if (collab) {
                collabs.add(
                    collab
                );
            }

        });


        filterArea.innerHTML = "";


        createButtonGroup(
            filterArea,
            "コラボ先",
            collabs,
            selectedCollab,
            value => {

                selectedCollab =
                    value;

                applyFilters();
            }
        );
    }


    // --------------------------------------
    // ユーラク他商品
    // --------------------------------------

    else {

        filterArea.innerHTML = "";
    }
}


// ==========================================
// 絞り込み中か
// ==========================================

function isFiltering() {

    const keyword =
        document
            .getElementById(
                "searchBox"
            )
            .value
            .toLowerCase();

    return Boolean(
        keyword ||
        selectedSize ||
        selectedFlavor ||
        selectedEvent ||
        selectedCollab
    );
}


// ==========================================
// 検索・絞り込み
// ==========================================

function applyFilters() {

    const keyword =
        document
            .getElementById(
                "searchBox"
            )
            .value
            .toLowerCase();

    const filtering =
        Boolean(
            keyword ||
            selectedSize ||
            selectedFlavor ||
            selectedEvent ||
            selectedCollab
        );


    document
        .querySelectorAll(
            "#tableArea table"
        )
        .forEach(table => {

            const rows =
                table.querySelectorAll(
                    "tbody tr"
                );

            let visibleCount = 0;


            rows.forEach(row => {

                let show = true;


                // ----------------------------------
                // 商品名
                // ----------------------------------

                const name =
                    row.children[0]
                        ?.textContent
                        .toLowerCase() || "";


                if (
                    keyword &&
                    !name.includes(keyword)
                ) {
                    show = false;
                }


                // ----------------------------------
                // ブラックサンダー
                // ----------------------------------

                if (
                    currentType === "index"
                ) {

                    const size =
                        row.dataset.filter || "";

                    const flavor =
                        row.dataset.flavor || "";

                    let eventList = [];

                    try {
                        eventList =
                            JSON.parse(
                                row.dataset.event ||
                                "[]"
                            );
                    }

                    catch {
                        eventList = [];
                    }


                    if (
                        selectedSize &&
                        size !== selectedSize
                    ) {
                        show = false;
                    }


                    if (
                        selectedFlavor &&
                        flavor !== selectedFlavor
                    ) {
                        show = false;
                    }


                    if (
                        selectedEvent &&
                        !eventList.includes(
                            selectedEvent
                        )
                    ) {
                        show = false;
                    }
                }


                // ----------------------------------
                // コラボメニュー
                // ----------------------------------

                else if (
                    currentType === "thun3"
                ) {

                    const collab =
                        row.dataset.filter || "";

                    if (
                        selectedCollab &&
                        collab !== selectedCollab
                    ) {
                        show = false;
                    }
                }


                row.style.display =
                    show
                        ? ""
                        : "none";


                if (show) {
                    visibleCount++;
                }

            });


            const h2 =
                table.previousElementSibling;


            // ----------------------------------
            // 絞り込み中
            // ----------------------------------

            if (filtering) {

                if (visibleCount > 0) {

                    if (h2) {

                        h2.style.display = "";

                        h2.textContent =
                            `▼ ${h2.dataset.year}（${visibleCount}件）`;
                    }

                    table.classList.remove(
                        "hidden"
                    );
                }

                else {

                    if (h2) {
                        h2.style.display =
                            "none";
                    }

                    table.classList.add(
                        "hidden"
                    );
                }
            }


            // ----------------------------------
            // 絞り込みなし
            // ----------------------------------

            else {

                if (h2) {
                    h2.style.display = "";
                }

                table.classList.add(
                    "hidden"
                );

                if (h2) {
                    updateYearHeading(
                        h2,
                        table
                    );
                }
            }

        });
}


// ==========================================
// 名前検索
// ==========================================

document
    .getElementById("searchBox")
    .addEventListener(
        "input",
        applyFilters
    );


// ==========================================
// 全表示
// ==========================================

document
    .getElementById("showAllBtn")
    .addEventListener(
        "click",
        () => {

            // 条件リセット
            selectedSize = "";
            selectedFlavor = "";
            selectedEvent = "";
            selectedCollab = "";

            document.getElementById(
                "searchBox"
            ).value = "";


            // 全商品表示
            document
                .querySelectorAll(
                    "#tableArea tbody tr"
                )
                .forEach(row => {
                    row.style.display = "";
                });


            // 全年代見出し表示
            document
                .querySelectorAll(
                    "#tableArea h2"
                )
                .forEach(h2 => {
                    h2.style.display = "";
                });


            // 全年代を開く
            document
                .querySelectorAll(
                    "#tableArea table"
                )
                .forEach(table => {
                    table.classList.remove(
                        "hidden"
                    );
                });


            updateAllYearHeadings();


            // 絞り込みボタンを
            // 「すべて」に戻す
            document
                .querySelectorAll(
                    ".filter-group"
                )
                .forEach(group => {

                    const buttons =
                        group.querySelectorAll(
                            "button"
                        );

                    buttons.forEach(
                        button =>
                            button.classList.remove(
                                "selected"
                            )
                    );

                    buttons[0]
                        ?.classList
                        .add("selected");
                });
        }
    );


// ==========================================
// 初期表示
// ==========================================

changeType("index");

</script>

</body>
</html>
