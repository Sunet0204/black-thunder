<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ブラックサンダー</title>

    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }

        .hidden {
            display: none;
        }

        .menu {
            margin-bottom: 20px;
        }

        .menu button {
            margin-right: 5px;
        }

        h2 {
            cursor: pointer;
        }

        /* 絞り込みボタン */
        #filterArea {
            margin-top: 15px;
            margin-bottom: 15px;
        }

        #filterArea button {
            margin-right: 5px;
            margin-bottom: 5px;
        }

        .filter-group {
            margin-bottom: 8px;
        }
        /* 選択中の絞り込みボタン */
        .filter-group button.selected {
        background-color: #333;
        color: white;
        font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>ブラックサンダー</h1>
    <p>種類</p>


    <!-- =========================
         表示切り替え
    ========================== -->

    <div class="menu">

        <button onclick="changeType('index')">
            ブラックサンダー
        </button>

        <button onclick="changeType('thun2')">
            ユーラク他商品
        </button>

        <button onclick="changeType('thun3')">
            コラボメニュー
        </button>

    </div>


    <!-- 全表示・名前検索 -->

    <button id="showAllBtn">
        全表示
    </button>

    <input
        type="text"
        id="searchBox"
        placeholder="name"
    >


    <!-- 絞り込みボタン -->

    <div id="filterArea"></div>


    <!-- 年・商品表 -->

    <div id="tableArea"></div>



<script>

    // ==========================================
    // 現在表示している種類
    // ==========================================

    let currentType = "index";


    // ==========================================
    // 現在選択している条件
    // ==========================================

    let selectedSize = "";
    let selectedFlavor = "";
    let selectedEvent = "";
    let selectedCollab = "";


    // ==========================================
    // 各ページの設定
    // ==========================================

    const dataTypes = {

        // ブラックサンダー
        index: {

            years: [
                1994, 2000, 2003, 2005, 2006,
                2008, 2009, 2010, 2011, 2012,
                2013, 2014, 2015, 2016, 2017,
                2018, 2019, 2020, 2021, 2022,
                2023, 2024, 2025, 2026
            ],

            getPath: function(year) {
                return "json/" + year + ".json";
            }

        },


        // ユーラク他商品
        thun2: {

            years: [
                1994, 2002, 2003, 2005, 2006,
                2008, 2009, 2010, 2011, 2012,
                2013, 2014, 2015, 2016, 2017,
                2018, 2019, 2020, 2021, 2022,
                2023, 2024, 2025, 2026
            ],

            getPath: function(year) {
                return "json2/" + year + "-2.json";
            }

        },


        // コラボメニュー
        thun3: {

            years: [
                1994, 2002, 2003, 2005, 2006,
                2008, 2009, 2010, 2011, 2012,
                2013, 2014, 2015, 2016, 2017,
                2018, 2019, 2020, 2021, 2022,
                2023, 2024, 2025, 2026
            ],

            getPath: function(year) {
                return "json3/" + year + "-3.json";
            }

        }

    };


    // ==========================================
    // JSONを読み込んで表を作る
    // ==========================================

    function makeTable(jsonFile, tbody, type) {

        fetch(jsonFile)

            .then(res => res.json())

            .then(items => {

                for (let i = 0; i < items.length; i++) {

                    const tr =
                        document.createElement("tr");


                    // ==================================
                    // 4列目
                    //
                    // ブラックサンダー → サイズ
                    // コラボメニュー → コラボ先
                    // ==================================

                    tr.dataset.filter =
                        items[i][3] || "";


                    // ==================================
                    // ブラックサンダーだけ
                    // 非表示情報を読み込む
                    // ==================================

                    if (type === "index") {

                        // [6] = 味
                        tr.dataset.flavor =
                            items[i][6] || "";

                        // [7] = 季節イベント
                        tr.dataset.event =
                            items[i][7] || "";

                    }


                    // ==================================
                    // 表を作る
                    // ==================================

                    for (let j = 0; j <= 4; j++) {

                        const td =
                            document.createElement("td");


                        // 名前
                        if (j === 0) {

                            const a =
                                document.createElement("a");

                            a.textContent =
                                items[i][j];

                            a.href =
                                items[i][5];

                            td.appendChild(a);

                        }


                        // 画像
                        else if (j === 4) {

                            const img =
                                document.createElement("img");

                            img.src =
                                items[i][j];

                            img.alt =
                                items[i][0];

                            img.width = 100;

                            td.appendChild(img);

                        }


                        // その他
                        else {

                            td.textContent =
                                items[i][j];

                        }


                        tr.appendChild(td);

                    }


                    tbody.appendChild(tr);

                }


                // JSON読み込み後に
                // フィルターボタンを更新
                createFilterButtons(type);

            })


            .catch(error => {

                console.error(
                    jsonFile +
                    " の読み込みに失敗しました",
                    error
                );

            });

    }


    // ==========================================
    // 表の見出し
    // ==========================================

    function makeList(tr, type) {

        let fourthColumn = "サイズ";


        // コラボメニューだけ変更
        if (type === "thun3") {

            fourthColumn = "コラボ先";

        }


        const list = [

            "名前",
            "発売日",
            "二つ名",
            fourthColumn,
            "画像"

        ];


        for (let i = 0; i < list.length; i++) {

            const th =
                document.createElement("th");

            th.textContent =
                list[i];

            tr.appendChild(th);

        }

    }


    // ==========================================
    // 表示する種類を変更
    // ==========================================

    function changeType(type) {

        currentType = type;


        // 絞り込み条件リセット
        selectedSize = "";
        selectedFlavor = "";
        selectedEvent = "";
        selectedCollab = "";


        const area =
            document.getElementById("tableArea");

        const filterArea =
            document.getElementById("filterArea");


        // 一度全部消す
        area.innerHTML = "";
        filterArea.innerHTML = "";


        // 検索欄リセット
        document
            .getElementById("searchBox")
            .value = "";


        const setting =
            dataTypes[type];

        const years =
            setting.years;


        // ======================================
        // 年ごとに表を作る
        // ======================================

        for (let i = 0; i < years.length; i++) {

            const year =
                years[i];


            // 年
            const h2 =
                document.createElement("h2");

            h2.textContent =
                year;


            // table
            const table =
                document.createElement("table");

            table.classList.add("hidden");


            // thead
            const thead =
                document.createElement("thead");

            const headerRow =
                document.createElement("tr");

            makeList(headerRow, type);

            thead.appendChild(headerRow);


            // tbody
            const tbody =
                document.createElement("tbody");


            table.appendChild(thead);
            table.appendChild(tbody);


            // ==================================
            // 年クリックで開閉
            // ==================================

            h2.onclick = function() {

                table.classList.toggle("hidden");

            };


            // HTMLへ追加
            area.appendChild(h2);
            area.appendChild(table);


            // JSON読み込み
            const jsonPath =
                setting.getPath(year);

            makeTable(
                jsonPath,
                tbody,
                type
            );

        }

    }


    // ==========================================
    // ボタングループを作る共通関数
    // ==========================================

    function createButtonGroup(
    filterArea,
    titleText,
    values,
    clickFunction
) {

    const div =
        document.createElement("div");

    div.classList.add("filter-group");


    const title =
        document.createElement("strong");

    title.textContent =
        titleText + "：";

    div.appendChild(title);


    // ======================================
    // 「すべて」ボタン
    // ======================================

    const allButton =
        document.createElement("button");

    allButton.textContent = "すべて";


    // 最初は「すべて」を選択状態にする
    allButton.classList.add("selected");


    allButton.onclick = function() {

        // このグループの選択状態を全部解除
        const buttons =
            div.querySelectorAll("button");

        buttons.forEach(button => {

            button.classList.remove("selected");

        });


        // 「すべて」を選択状態にする
        allButton.classList.add("selected");


        // 絞り込み実行
        clickFunction("");

    };


    div.appendChild(allButton);


    // ======================================
    // 各項目のボタン
    // ======================================

    values.forEach(value => {

        const button =
            document.createElement("button");

        button.textContent =
            value;


        button.onclick = function() {

            // このグループのボタンだけ
            // 選択状態を解除
            const buttons =
                div.querySelectorAll("button");

            buttons.forEach(btn => {

                btn.classList.remove("selected");

            });


            // 押したボタンだけ選択状態
            button.classList.add("selected");


            // 絞り込み実行
            clickFunction(value);

        };


        div.appendChild(button);

    });


    filterArea.appendChild(div);

}


    // ==========================================
    // 絞り込みボタンを作る
    // ==========================================

    function createFilterButtons(type) {

        const filterArea =
            document.getElementById("filterArea");


        const rows =
            document.querySelectorAll(
                "#tableArea tbody tr"
            );


        // ======================================
        // ブラックサンダー
        //
        // サイズ
        // 味
        // 季節イベント
        // ======================================

        if (type === "index") {

            const sizes =
                new Set();

            const flavors =
                new Set();

            const events =
                new Set();


            rows.forEach(row => {

                const size =
                    row.dataset.filter;

                const flavor =
                    row.dataset.flavor;

                const event =
                    row.dataset.event;


                if (size) {
                    sizes.add(size);
                }

                if (flavor) {
                    flavors.add(flavor);
                }

                if (event) {
                    events.add(event);
                }

            });


            filterArea.innerHTML = "";


            // -------------------------------
            // サイズ
            // -------------------------------

            createButtonGroup(
                filterArea,
                "サイズ",
                sizes,

                function(value) {

                    selectedSize = value;

                    applyFilters();

                }
            );


            // -------------------------------
            // 味
            // -------------------------------

            createButtonGroup(
                filterArea,
                "味",
                flavors,

                function(value) {

                    selectedFlavor = value;

                    applyFilters();

                }
            );


            // -------------------------------
            // 季節イベント
            // -------------------------------

            createButtonGroup(
                filterArea,
                "季節イベント",
                events,

                function(value) {

                    selectedEvent = value;

                    applyFilters();

                }
            );

        }


        // ======================================
        // コラボメニュー
        //
        // コラボ先だけ
        // ======================================

        else if (type === "thun3") {

            const collabs =
                new Set();


            rows.forEach(row => {

                const collab =
                    row.dataset.filter;

                if (collab) {

                    collabs.add(collab);

                }

            });


            filterArea.innerHTML = "";


            createButtonGroup(
                filterArea,
                "コラボ先",
                collabs,

                function(value) {

                    selectedCollab = value;

                    applyFilters();

                }
            );

        }


        // ======================================
        // ユーラク他商品
        //
        // 絞り込みなし
        // ======================================

        else {

            filterArea.innerHTML = "";

        }

    }


    // ==========================================
    // 絞り込みを実行
    // ==========================================

    function applyFilters() {

        const rows =
            document.querySelectorAll(
                "#tableArea tbody tr"
            );


        rows.forEach(row => {

            let show = true;


            // ==================================
            // ブラックサンダー
            // ==================================

            if (currentType === "index") {

                const size =
                    row.dataset.filter || "";

                const flavor =
                    row.dataset.flavor || "";

                const event =
                    row.dataset.event || "";


                // サイズ
                if (
                    selectedSize !== "" &&
                    size !== selectedSize
                ) {

                    show = false;

                }


                // 味
                if (
                    selectedFlavor !== "" &&
                    flavor !== selectedFlavor
                ) {

                    show = false;

                }


                // 季節イベント
                if (
                    selectedEvent !== "" &&
                    event !== selectedEvent
                ) {

                    show = false;

                }

            }


            // ==================================
            // コラボメニュー
            // ==================================

            else if (currentType === "thun3") {

                const collab =
                    row.dataset.filter || "";


                if (
                    selectedCollab !== "" &&
                    collab !== selectedCollab
                ) {

                    show = false;

                }

            }


            // 表示・非表示
            if (show) {

                row.style.display = "";

            }

            else {

                row.style.display = "none";

            }

        });


        // ======================================
        // 商品がある年だけ開く
        // ======================================

        const tables =
            document.querySelectorAll(
                "#tableArea table"
            );


        tables.forEach(table => {

            const tableRows =
                table.querySelectorAll(
                    "tbody tr"
                );


            let found = false;


            tableRows.forEach(row => {

                if (
                    row.style.display !== "none"
                ) {

                    found = true;

                }

            });


            if (found) {

                table.classList.remove("hidden");

            }

            else {

                table.classList.add("hidden");

            }

        });

    }


    // ==========================================
    // 名前検索
    // ==========================================

    document
        .getElementById("searchBox")
        .addEventListener("input", function() {

            const keyword =
                this.value.toLowerCase();


            const rows =
                document.querySelectorAll(
                    "#tableArea tbody tr"
                );


            rows.forEach(row => {

                const nameCell =
                    row.children[0];


                if (!nameCell) {
                    return;
                }


                const text =
                    nameCell
                        .textContent
                        .toLowerCase();


                if (text.includes(keyword)) {

                    row.style.display = "";

                }

                else {

                    row.style.display = "none";

                }

            });

        });


    // ==========================================
    // 全表示
    // ==========================================

    document
        .getElementById("showAllBtn")
        .addEventListener("click", function() {


            // 絞り込み条件リセット
            selectedSize = "";
            selectedFlavor = "";
            selectedEvent = "";
            selectedCollab = "";


            // 全行表示
            const rows =
                document.querySelectorAll(
                    "#tableArea tbody tr"
                );


            rows.forEach(row => {

                row.style.display = "";

            });


            // 全テーブルを開く
            const tables =
                document.querySelectorAll(
                    "#tableArea table"
                );


            tables.forEach(table => {

                table.classList.remove("hidden");

            });


            // 検索欄リセット
            document
                .getElementById("searchBox")
                .value = "";

        });


    // ==========================================
    // 最初はブラックサンダー
    // ==========================================

    changeType("index");

</script>

</body>
</html>
