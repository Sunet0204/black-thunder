<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ブラックサンダー</title>

    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }

        .hidden {
            display: none;
        }

        .menu {
            margin-bottom: 20px;
        }

        .menu button {
            margin-right: 5px;
        }

        h2 {
            cursor: pointer;
        }

        /* 絞り込みボタン */
        #filterArea {
            margin-top: 15px;
            margin-bottom: 15px;
        }

        #filterArea button {
            margin-right: 5px;
            margin-bottom: 5px;
        }

        .filter-group {
            margin-bottom: 8px;
        }

        /* 選択中の絞り込みボタン */
        .filter-group button.selected {
            background-color: #333;
            color: white;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>ブラックサンダー</h1>
    <p>種類</p>


    <!-- =========================
         表示切り替え
    ========================== -->

    <div class="menu">

        <button onclick="changeType('index')">
            ブラックサンダー
        </button>

        <button onclick="changeType('thun2')">
            ユーラク他商品
        </button>

        <button onclick="changeType('thun3')">
            コラボメニュー
        </button>

    </div>


    <!-- =========================
         全表示・名前検索
    ========================== -->

    <button id="showAllBtn">
        全表示
    </button>

    <input
        type="text"
        id="searchBox"
        placeholder="name"
    >


    <!-- =========================
         絞り込みボタン
    ========================== -->

    <div id="filterArea"></div>


    <!-- =========================
         年・商品表
    ========================== -->

    <div id="tableArea"></div>



<script>

    // ==========================================
    // 現在表示している種類
    // ==========================================

    let currentType = "index";


    // ==========================================
    // 現在選択している絞り込み条件
    // ==========================================

    let selectedSize = "";
    let selectedFlavor = "";
    let selectedEvent = "";
    let selectedCollab = "";


    // ==========================================
    // 各ページの設定
    // ==========================================

    const dataTypes = {

        // --------------------------------------
        // ブラックサンダー
        // --------------------------------------

        index: {

            years: [
                1994, 2000, 2003, 2005, 2006,
                2008, 2009, 2010, 2011, 2012,
                2013, 2014, 2015, 2016, 2017,
                2018, 2019, 2020, 2021, 2022,
                2023, 2024, 2025, 2026
            ],

            getPath: function(year) {

                return "json/" + year + ".json";

            }

        },


        // --------------------------------------
        // ユーラク他商品
        // --------------------------------------

        thun2: {

            years: [
                1994, 2002, 2003, 2005, 2006,
                2008, 2009, 2010, 2011, 2012,
                2013, 2014, 2015, 2016, 2017,
                2018, 2019, 2020, 2021, 2022,
                2023, 2024, 2025, 2026
            ],

            getPath: function(year) {

                return "json2/" + year + "-2.json";

            }

        },


        // --------------------------------------
        // コラボメニュー
        // --------------------------------------

        thun3: {

            years: [
                1994, 2002, 2003, 2005, 2006,
                2008, 2009, 2010, 2011, 2012,
                2013, 2014, 2015, 2016, 2017,
                2018, 2019, 2020, 2021, 2022,
                2023, 2024, 2025, 2026
            ],

            getPath: function(year) {

                return "json3/" + year + "-3.json";

            }

        }

    };


    // ==========================================
    // JSONを読み込んで表を作る
    // ==========================================

    function makeTable(jsonFile, tbody, type) {

        fetch(jsonFile)

            .then(res => res.json())

            .then(items => {

                /*
                 * 表示切り替え後に古いfetchが返ってきた場合は
                 * そのデータを使わない
                 */
                if (type !== currentType) {

                    return;

                }


                for (let i = 0; i < items.length; i++) {

                    const tr =
                        document.createElement("tr");


                    // ==================================
                    // [3]
                    //
                    // ブラックサンダー → サイズ
                    // コラボメニュー → コラボ先
                    // ==================================

                    tr.dataset.filter =
                        items[i][3] || "";


                    // ==================================
                    // ブラックサンダーだけ
                    // 非表示情報を読み込む
                    // ==================================

                    if (type === "index") {

                        // [6] = 味
                        tr.dataset.flavor =
                            items[i][6] || "";


                        // [7] = 季節イベント
                        tr.dataset.event =
                            items[i][7] || "";

                    }


                    // ==================================
                    // 表を作る
                    //
                    // [0] 名前
                    // [1] 発売日
                    // [2] 二つ名
                    // [3] サイズ / コラボ先
                    // [4] 画像
                    //
                    // [5] URLは名前のリンクに使用
                    // [6][7]は表には表示しない
                    // ==================================

                    for (let j = 0; j <= 4; j++) {

                        const td =
                            document.createElement("td");


                        // ------------------------------
                        // 名前
                        // ------------------------------

                        if (j === 0) {

                            const a =
                                document.createElement("a");

                            a.textContent =
                                items[i][j];

                            a.href =
                                items[i][5];

                            td.appendChild(a);

                        }


                        // ------------------------------
                        // 画像
                        // ------------------------------

                        else if (j === 4) {

                            const img =
                                document.createElement("img");

                            img.src =
                                items[i][j];

                            img.alt =
                                items[i][0];

                            img.width = 100;

                            td.appendChild(img);

                        }


                        // ------------------------------
                        // その他
                        // ------------------------------

                        else {

                            td.textContent =
                                items[i][j];

                        }


                        tr.appendChild(td);

                    }


                    tbody.appendChild(tr);

                }


                // ==================================
                // フィルターボタンを更新
                // ==================================

                createFilterButtons(type);


                // ==================================
                // 現在検索・絞り込み中なら
                // 新しく読み込んだ商品にも適用
                // ==================================

                if (isFiltering()) {

                    applyFilters();

                }

            })


            .catch(error => {

                console.error(
                    jsonFile +
                    " の読み込みに失敗しました",
                    error
                );

            });

    }


    // ==========================================
    // 表の見出し
    // ==========================================

    function makeList(tr, type) {

        let fourthColumn = "サイズ";


        // コラボメニューの場合
        if (type === "thun3") {

            fourthColumn = "コラボ先";

        }


        const list = [

            "名前",
            "発売日",
            "二つ名",
            fourthColumn,
            "画像"

        ];


        for (let i = 0; i < list.length; i++) {

            const th =
                document.createElement("th");

            th.textContent =
                list[i];

            tr.appendChild(th);

        }

    }


    // ==========================================
    // 表示する種類を変更
    // ==========================================

    function changeType(type) {

        currentType = type;


        // ======================================
        // 絞り込み条件リセット
        // ======================================

        selectedSize = "";
        selectedFlavor = "";
        selectedEvent = "";
        selectedCollab = "";


        const area =
            document.getElementById("tableArea");

        const filterArea =
            document.getElementById("filterArea");


        // ======================================
        // 一度全部消す
        // ======================================

        area.innerHTML = "";
        filterArea.innerHTML = "";


        // ======================================
        // 検索欄リセット
        // ======================================

        document
            .getElementById("searchBox")
            .value = "";


        const setting =
            dataTypes[type];

        const years =
            setting.years;


        // ======================================
        // 年ごとに表を作る
        // ======================================

        for (let i = 0; i < years.length; i++) {

            const year =
                years[i];


            // ----------------------------------
            // 年
            // ----------------------------------

            const h2 =
                document.createElement("h2");

            h2.textContent =
                year;


            // ----------------------------------
            // table
            // ----------------------------------

            const table =
                document.createElement("table");

            table.classList.add("hidden");


            // ----------------------------------
            // thead
            // ----------------------------------

            const thead =
                document.createElement("thead");

            const headerRow =
                document.createElement("tr");

            makeList(headerRow, type);

            thead.appendChild(headerRow);


            // ----------------------------------
            // tbody
            // ----------------------------------

            const tbody =
                document.createElement("tbody");


            table.appendChild(thead);
            table.appendChild(tbody);


            // ==================================
            // 年クリックで開閉
            // ==================================

            h2.onclick = function() {

                table.classList.toggle("hidden");

            };


            // ==================================
            // HTMLへ追加
            // ==================================

            area.appendChild(h2);
            area.appendChild(table);


            // ==================================
            // JSON読み込み
            // ==================================

            const jsonPath =
                setting.getPath(year);


            makeTable(
                jsonPath,
                tbody,
                type
            );

        }

    }


    // ==========================================
    // ボタングループを作る共通関数
    // ==========================================

    function createButtonGroup(
        filterArea,
        titleText,
        values,
        selectedValue,
        clickFunction
    ) {

        const div =
            document.createElement("div");

        div.classList.add("filter-group");


        const title =
            document.createElement("strong");

        title.textContent =
            titleText + "：";

        div.appendChild(title);


        // ======================================
        // 「すべて」ボタン
        // ======================================

        const allButton =
            document.createElement("button");

        allButton.textContent =
            "すべて";


        // 現在何も選択されていなければ
        // 「すべて」を選択状態にする
        if (selectedValue === "") {

            allButton.classList.add("selected");

        }


        allButton.onclick = function() {

            const buttons =
                div.querySelectorAll("button");


            buttons.forEach(button => {

                button.classList.remove("selected");

            });


            allButton.classList.add("selected");


            clickFunction("");

        };


        div.appendChild(allButton);


        // ======================================
        // 各項目のボタン
        // ======================================

        values.forEach(value => {

            const button =
                document.createElement("button");

            button.textContent =
                value;


            // 現在選択されている値なら変色
            if (selectedValue === value) {

                button.classList.add("selected");

            }


            button.onclick = function() {

                const buttons =
                    div.querySelectorAll("button");


                buttons.forEach(btn => {

                    btn.classList.remove("selected");

                });


                button.classList.add("selected");


                clickFunction(value);

            };


            div.appendChild(button);

        });


        filterArea.appendChild(div);

    }


    // ==========================================
    // 絞り込みボタンを作る
    // ==========================================

    function createFilterButtons(type) {

        /*
         * 古いfetchから呼び出された場合は
         * ボタンを作り直さない
         */
        if (type !== currentType) {

            return;

        }


        const filterArea =
            document.getElementById("filterArea");


        const rows =
            document.querySelectorAll(
                "#tableArea tbody tr"
            );


        // ======================================
        // ブラックサンダー
        //
        // サイズ
        // 味
        // 季節イベント
        // ======================================

        if (type === "index") {

            const sizes =
                new Set();

            const flavors =
                new Set();

            const events =
                new Set();


            rows.forEach(row => {

                const size =
                    row.dataset.filter;

                const flavor =
                    row.dataset.flavor;

                const event =
                    row.dataset.event;


                if (size) {

                    sizes.add(size);

                }


                if (flavor) {

                    flavors.add(flavor);

                }


                if (event) {

                    events.add(event);

                }

            });


            filterArea.innerHTML = "";


            // ----------------------------------
            // サイズ
            // ----------------------------------

            createButtonGroup(
                filterArea,
                "サイズ",
                sizes,
                selectedSize,

                function(value) {

                    selectedSize = value;

                    applyFilters();

                }
            );


            // ----------------------------------
            // 味
            // ----------------------------------

            createButtonGroup(
                filterArea,
                "味",
                flavors,
                selectedFlavor,

                function(value) {

                    selectedFlavor = value;

                    applyFilters();

                }
            );


            // ----------------------------------
            // 季節イベント
            // ----------------------------------

            createButtonGroup(
                filterArea,
                "季節イベント",
                events,
                selectedEvent,

                function(value) {

                    selectedEvent = value;

                    applyFilters();

                }
            );

        }


        // ======================================
        // コラボメニュー
        //
        // コラボ先だけ
        // ======================================

        else if (type === "thun3") {

            const collabs =
                new Set();


            rows.forEach(row => {

                const collab =
                    row.dataset.filter;


                if (collab) {

                    collabs.add(collab);

                }

            });


            filterArea.innerHTML = "";


            createButtonGroup(
                filterArea,
                "コラボ先",
                collabs,
                selectedCollab,

                function(value) {

                    selectedCollab = value;

                    applyFilters();

                }
            );

        }


        // ======================================
        // ユーラク他商品
        //
        // 絞り込みなし
        // ======================================

        else {

            filterArea.innerHTML = "";

        }

    }


    // ==========================================
    // 現在検索・絞り込み中か調べる
    // ==========================================

    function isFiltering() {

        const keyword =
            document
                .getElementById("searchBox")
                .value
                .toLowerCase();


        return (
            keyword !== "" ||
            selectedSize !== "" ||
            selectedFlavor !== "" ||
            selectedEvent !== "" ||
            selectedCollab !== ""
        );

    }


    // ==========================================
    // 名前検索・絞り込みをまとめて実行
    // ==========================================

    function applyFilters() {

        // ======================================
        // 検索文字
        // ======================================

        const keyword =
            document
                .getElementById("searchBox")
                .value
                .toLowerCase();


        const tables =
            document.querySelectorAll(
                "#tableArea table"
            );


        // ======================================
        // 年代ごとに判定
        // ======================================

        tables.forEach(table => {

            const rows =
                table.querySelectorAll(
                    "tbody tr"
                );


            let found = false;


            // ==================================
            // 商品ごとに判定
            // ==================================

            rows.forEach(row => {

                let show = true;


                // ==============================
                // 名前検索
                // ==============================

                const nameCell =
                    row.children[0];


                if (nameCell) {

                    const name =
                        nameCell
                            .textContent
                            .toLowerCase();


                    if (
                        keyword !== "" &&
                        !name.includes(keyword)
                    ) {

                        show = false;

                    }

                }


                // ==============================
                // ブラックサンダー
                // ==============================

                if (currentType === "index") {

                    const size =
                        row.dataset.filter || "";

                    const flavor =
                        row.dataset.flavor || "";

                    const event =
                        row.dataset.event || "";


                    // --------------------------
                    // サイズ
                    // --------------------------

                    if (
                        selectedSize !== "" &&
                        size !== selectedSize
                    ) {

                        show = false;

                    }


                    // --------------------------
                    // 味
                    // --------------------------

                    if (
                        selectedFlavor !== "" &&
                        flavor !== selectedFlavor
                    ) {

                        show = false;

                    }


                    // --------------------------
                    // 季節イベント
                    // --------------------------

                    if (
                        selectedEvent !== "" &&
                        event !== selectedEvent
                    ) {

                        show = false;

                    }

                }


                // ==============================
                // コラボメニュー
                // ==============================

                else if (currentType === "thun3") {

                    const collab =
                        row.dataset.filter || "";


                    if (
                        selectedCollab !== "" &&
                        collab !== selectedCollab
                    ) {

                        show = false;

                    }

                }


                // ==============================
                // 行を表示・非表示
                // ==============================

                if (show) {

                    row.style.display = "";

                    // この年代に
                    // 1件以上該当商品がある
                    found = true;

                }

                else {

                    row.style.display = "none";

                }

            });


            // ==================================
            // このtableに対応する年代h2
            // ==================================

            const yearHeading =
                table.previousElementSibling;


            // ==================================
            // 検索・絞り込み中か
            // ==================================

            const filtering =
                keyword !== "" ||
                selectedSize !== "" ||
                selectedFlavor !== "" ||
                selectedEvent !== "" ||
                selectedCollab !== "";


            // ==================================
            // 検索・絞り込み中
            // ==================================

            if (filtering) {

                // ------------------------------
                // 1件以上見つかった年代
                // ------------------------------

                if (found) {

                    // 年代を表示
                    if (yearHeading) {

                        yearHeading.style.display = "";

                    }


                    // 表も開く
                    table.classList.remove("hidden");

                }


                // ------------------------------
                // 0件の年代
                // ------------------------------

                else {

                    // ★年代そのものを非表示
                    if (yearHeading) {

                        yearHeading.style.display = "none";

                    }


                    // 表も非表示
                    table.classList.add("hidden");

                }

            }


            // ==================================
            // 検索・絞り込みしていない
            // ==================================

            else {

                // 年代は表示
                if (yearHeading) {

                    yearHeading.style.display = "";

                }


                // 表は閉じる
                table.classList.add("hidden");

            }

        });

    }


    // ==========================================
    // 名前検索
    // ==========================================

    document
        .getElementById("searchBox")
        .addEventListener("input", function() {

            /*
             * 名前検索もサイズ・味・季節イベントと
             * 同じapplyFiltersで処理する
             */
            applyFilters();

        });


    // ==========================================
    // 全表示
    // ==========================================

    document
        .getElementById("showAllBtn")
        .addEventListener("click", function() {


            // ======================================
            // 絞り込み条件リセット
            // ======================================

            selectedSize = "";
            selectedFlavor = "";
            selectedEvent = "";
            selectedCollab = "";


            // ======================================
            // 検索欄リセット
            // ======================================

            document
                .getElementById("searchBox")
                .value = "";


            // ======================================
            // 全商品を表示
            // ======================================

            const rows =
                document.querySelectorAll(
                    "#tableArea tbody tr"
                );


            rows.forEach(row => {

                row.style.display = "";

            });


            // ======================================
            // 全年代を表示
            // ======================================

            const headings =
                document.querySelectorAll(
                    "#tableArea h2"
                );


            headings.forEach(h2 => {

                h2.style.display = "";

            });


            // ======================================
            // 全テーブルを開く
            // ======================================

            const tables =
                document.querySelectorAll(
                    "#tableArea table"
                );


            tables.forEach(table => {

                table.classList.remove("hidden");

            });


            // ======================================
            // 絞り込みボタンを
            // 「すべて」に戻す
            // ======================================

            const groups =
                document.querySelectorAll(
                    ".filter-group"
                );


            groups.forEach(group => {

                const buttons =
                    group.querySelectorAll(
                        "button"
                    );


                buttons.forEach(button => {

                    button.classList.remove(
                        "selected"
                    );

                });


                // 各グループの最初のボタン
                // ＝「すべて」
                if (buttons[0]) {

                    buttons[0]
                        .classList
                        .add("selected");

                }

            });

        });


    // ==========================================
    // 最初はブラックサンダー
    // ==========================================

    changeType("index");

</script>

</body>
</html>
